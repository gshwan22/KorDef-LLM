# accelerate config for train_fft_v2.py on GP25SV2 (2x H200 NVL 143GB)
# Single node, 2 processes, FULL_SHARD without CPU offload
# (fits in GPU memory; offload would only slow it down).
# Pair with: --grad-accum 64  (1 x 64 x 2 = effective batch 128)
compute_environment: LOCAL_MACHINE
distributed_type: FSDP
mixed_precision: bf16
num_machines: 1
num_processes: 2
machine_rank: 0
main_training_function: main
rdzv_backend: static
same_network: true
fsdp_config:
  fsdp_auto_wrap_policy: TRANSFORMER_BASED_WRAP
  fsdp_transformer_layer_cls_to_wrap: Gemma3DecoderLayer
  fsdp_sharding_strategy: FULL_SHARD
  fsdp_offload_params: false
  fsdp_state_dict_type: FULL_STATE_DICT
  fsdp_backward_prefetch: BACKWARD_PRE
  fsdp_forward_prefetch: false
  fsdp_use_orig_params: true
  fsdp_cpu_ram_efficient_loading: true
  fsdp_sync_module_states: true
downcast_bf16: 'no'
tpu_env: []
tpu_use_cluster: false
tpu_use_sudo: false
use_cpu: false
